<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promoções da Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Centralizar o carrossel */
        .carousel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .carousel-inner img {
            margin: auto;
        }
    </style>
</head>
<body>
    <!-- 1ª Digitação (Aqui) -->
     <nav class="navbar navbar-expand-lg navbar-light bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-bootstrap-fill text-light"></i>
            </a>

            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li >
                        <a class="nav-link active text-light" href="#">Início</a>
                    </li>

                    <li>
                        <a class="nav-link text-light" href="">Ofertas</a>
                    </li>

                    <li>
                        <a class="nav-link text-light" href="">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

                            <!-- Promoção -->
    <div class="container mt-3">
  <div class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
    <i class="bi bi-megaphone-fill me-2"></i>
    <strong>Promoção!</strong> 30% de Desconto em todos os produtos.
    
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
</div>

                                <!-- Carrossel -->
<div class="container mt-3">
        <div id="carouselExemplo" class="carousel slide mt-5" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active"> 
                    <img src="https://placehold.co/700x200/000000/FFF" class="d-block w-100" alt="Slide 1">
                </div>

                <div class="carousel-item">
                    <img src="https://placehold.co/700x200/orange/white" class="d-block w-100"alt="Slide 2">
                </div>

                <div class="carousel-item">
                    <img src="https://placehold.co/700x200/gray/black" class="d-block w-100"alt="3">
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExemplo" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#carouselExemplo" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>
    </div>

                                <!-- Progress bar -->
    <div class="container mt-3">
        <h5 class="mt-4">Progresso:</h5>
        <div class="progress mb-3">
            <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar" role="progressbar" style="width: 0%;">
                0%
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="decreaseBtn">-10%</button>
            <button class="btn btn-primary" id="increase-progress">+10%</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        document.getElementById('increase-progress').addEventListener('click', function() {
            let progressBar = document.getElementById('progress-bar');
            
            // Agora que o style="width: 0%" existe no HTML, o parseInt funciona!
            let width = parseInt(progressBar.style.width) || 0;
            
            if (width < 100) {
                width += 20;
                progressBar.style.width = width + "%";
                progressBar.textContent = width + "%";

                if (width === 100) {
                    alert("🎉 Parabéns! Você desbloqueou um desconto especial!");
                }
            }
        });
    </script>
</body>
</html>
